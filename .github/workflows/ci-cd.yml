name: CI/CD Pipeline - Weather App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: # Pozwala na ręczne uruchomienie akcji z poziomu GitHuba

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Wymagane do wypchnięcia obrazu do GHCR

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja QEMU (Wsparcie wieloplatformowe)
        uses: docker/setup-qemu-action@v3

      - name: Konfiguracja Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logowanie do DockerHub (na potrzeby zapisu Cache)
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Logowanie do GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Konfiguracja klucza SSH dla Buildx
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Budowa lokalnego obrazu (tylko amd64) na potrzeby skanowania
      - name: Budowa lokalna do testu CVE
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # Ładuje obraz do lokalnego demona, nie wysyła go do sieci
          tags: test-image:latest
          ssh: |
            default=${{ env.SSH_AUTH_SOCK }}

      # Skanowanie CVE
      - name: Skanowanie obrazu przy użyciu Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "test-image:latest"
          format: "table"
          exit-code: "1" # przerywa pipline, jeśli znajdzie poniższe zagrożenia
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # Jeśli skan się powiódł to następuje budowa na wielearchitektur i wypychamy zmiany do GHCR
      - name: Budowa wieloarchitekturowa i Push do GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/pawcho-weather:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pawcho-weather:latest
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/pawcho-weather:cache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/pawcho-weather:cache,mode=max
          ssh: |
            default=${{ env.SSH_AUTH_SOCK }}
